services:
  web:
    build: .
    container_name: tutorias_web
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_NAME=${DB_NAME:-tutorias_db}
      - DB_USER=${DB_USER:-tutorias_user}
      - DB_PASS=${DB_PASS}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - AUTH_TOKEN_TTL=${AUTH_TOKEN_TTL:-86400}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5174}
      - MAIL_MODE=${MAIL_MODE:-sandbox}
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: tutorias_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME:-tutorias_db}
      MYSQL_USER: ${DB_USER:-tutorias_user}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/migration_permisos.sql:/docker-entrypoint-initdb.d/02_migration_permisos.sql
      - ./database/seed_carreras_materias_horarios.sql:/docker-entrypoint-initdb.d/03_seed_carreras_materias_horarios.sql
      - ./database/migrations/gestion_cupos_periodos.sql:/docker-entrypoint-initdb.d/04_gestion_cupos_periodos.sql
      - ./database/migrations/05_notificaciones.sql:/docker-entrypoint-initdb.d/05_notificaciones.sql
      - ./database/migrations/06_password_reset_tokens.sql:/docker-entrypoint-initdb.d/06_password_reset_tokens.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: tutorias_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: ${DB_HOST:-db}
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASS}
    depends_on:
      - db

volumes:
  mysql_data:
